<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Form - Bootstrap 5</title>
<!-- Bootstrap 5 CSS CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">
<!-- Bootstrap Icons CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrapicons.min.css">
</head>
<body class="bg-light">
<div class="container min-vh-100 d-flex justify-content-center align-items-center py-5">
<div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
<div class="card shadow-sm border-0 rounded-3">
<div class="card-body p-4 p-sm-5">
<h3 class="card-title text-center fw-bold mb-1">Student Login</h3>
<p class="text-center text-muted small mb-4">Application Development &amp; Software
Engineering</p>
<!-- Alert feedback box -->
<div id="alertBox" class="alert d-none py-2 text-center small mb-3" role="alert"></div>
<form id="loginForm">
<!-- Email -->
<div class="mb-3">
<label for="email" class="form-label fw-semibold small">Email Address</label>
<div class="input-group">
<span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></
span>
<input
type="email"
class="form-control"
id="email"
placeholder="student@cu.edu.ng"
required
>
</div>
</div>
<!-- Password -->
<div class="mb-3">
<div class="d-flex justify-content-between align-items-center">
<label for="password" class="form-label fw-semibold small mb-1">Password</label>
<a href="#" class="text-decoration-none small text-primary">Forgot password?</a>
</div>
<div class="input-group">
<span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></
span>
<input
type="password"
class="form-control"
id="password"
placeholder="Enter password"
required
>
<button
class="btn btn-outline-secondary bg-white text-muted"
type="button"
id="togglePasswordBtn"
onclick="togglePassword()"
>
<i class="bi bi-eye" id="toggleIcon"></i>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="mb-3 form-check">
<input type="checkbox" class="form-check-input" id="rememberMe">
<label class="form-check-label text-muted small" for="rememberMe">Remember me</
label>
</div>
<!-- Submit Button -->
<button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</
button>
<!-- Sign Up Link -->
<p class="text-center text-muted small mt-4 mb-0">
Don't have an account? <a href="#" class="text-primary text-decoration-none fwsemibold">
Sign up</a>
</p>
</form>
</div>
</div>
<div class="text-center mt-3">
<small class="text-muted">Application Development &bull; Bootstrap 5 Assignment</
small>
</div>
</div>
</div>
<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></
script>
<script>
// Show / Hide Password function
function togglePassword() {
var passwordInput = document.getElementById("password");
var toggleIcon = document.getElementById("toggleIcon");
if (passwordInput.type === "password") {
passwordInput.type = "text";
toggleIcon.classList.remove("bi-eye");
toggleIcon.classList.add("bi-eye-slash");
} else {
passwordInput.type = "password";
toggleIcon.classList.remove("bi-eye-slash");
toggleIcon.classList.add("bi-eye");
}
}
// Form submit validation handler
document.getElementById("loginForm").addEventListener("submit", function(e) {
e.preventDefault();
var email = document.getElementById("email").value.trim();
var password = document.getElementById("password").value;
var alertBox = document.getElementById("alertBox");
if (!email || !password) {
alertBox.className = "alert alert-danger py-2 text-center small mb-3";
alertBox.textContent = "Please complete all fields.";
alertBox.classList.remove("d-none");
return;
}
// Check credentials for demonstration
if (email === "student@cu.edu.ng" && password === "password110") {
alertBox.className = "alert alert-success py-2 text-center small mb-3";
alertBox.textContent = "Login Successful! Welcome back.";
alertBox.classList.remove("d-none");
} else {
alertBox.className = "alert alert-danger py-2 text-center small mb-3";
alertBox.textContent = "Invalid email or password.";
alertBox.classList.remove("d-none");
}
});
</script>
</body>
</html>
